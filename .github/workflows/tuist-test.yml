      - name: Install Tuist
        run: |
          bash <(curl -Ls https://install.tuist.io)
          
      - name: Generate Secret.xcconfig
        env:
          KAKAO_NATIVE_KEY: ${{ secrets.KAKAO_NATIVE_KEY }}
        run: |
          echo "// Automatically generated by GitHub Actions" > Tuist/Configurations/Secret.xcconfig
          echo "KAKAO_NATIVE_KEY = $KAKAO_NATIVE_KEY" >> Tuist/Configurations/Secret.xcconfig
          cat Tuist/Configurations/Secret.xcconfig
    
      - name: Install Dependencies
        run: |
          tuist install
          
      - name: Build Project
        run: |
          tuist build
          
      - name: Run Tests
        run: |
          tuist test
          
