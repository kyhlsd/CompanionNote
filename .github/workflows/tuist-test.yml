name: Tuist Test on PR to develop

on:
  pull_request:
    branches:
      - develop

jobs:
  tuist-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Tuist build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .tuist/Cache
            .build
            DerivedData
          key: tuist-${{ runner.os }}-${{ hashFiles('**/Project.swift', '**/Workspace.swift', '**/Tuist/Dependencies.swift') }}
          restore-keys: |
            tuist-${{ runner.os }}-
            
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          
      - name: Install Tuist
        run: curl -Ls https://install.tuist.io | bash
        
      - name: Generate project
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export SWIFTFLAGS="-enable-experimental-feature AccessLevelOnImport"
          tuist fetch
          tuist generate
          
      - name: Build project
        run: |
          export SWIFTFLAGS="-enable-experimental-feature AccessLevelOnImport"
          export OTHER_SWIFT_FLAGS="-enable-experimental-feature AccessLevelOnImport"
          tuist build
          
      - name: Run Tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export OTHER_SWIFT_FLAGS="-enable-experimental-feature AccessLevelOnImport"
          tuist test
          
