name: Tuist Test on PR to develop

on:
  pull_request:
    branches:
      - develop

jobs:
  tuist-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Install Tuist
        run: |
          curl -Ls https://get.tuist.io | bash
          
      - name: Cache Tuist build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .tuist/Cache
            .build
            DerivedData
          key: tuist-${{ runner.os }}-${{ hashFiles('**/Project.swift', '**/Workspace.swift', '**/Tuist/Dependencies.swift') }}
          restore-keys: |
            tuist-${{ runner.os }}-
          
      - name: Generate Secret.xcconfig
        env:
          KAKAO_NATIVE_KEY: ${{ secrets.KAKAO_NATIVE_KEY }}
        run: |
          echo "// Automatically generated by GitHub Actions" > Tuist/Configurations/Secret.xcconfig
          echo "KAKAO_NATIVE_KEY = $KAKAO_NATIVE_KEY" >> Tuist/Configurations/Secret.xcconfig
          cat Tuist/Configurations/Secret.xcconfig
          
      - name: Generate GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > CompanionNote/Resources/GoogleService-Info.plist
          
      - name: Install Dependencies
        run: |
          tuist install
          
      - name: Build Project
        run: |
          tuist build
          
      - name: Run Tests
        run: |
          export OTHER_SWIFT_FLAGS="-enable-experimental-feature AccessLevelOnImport"
          tuist test

