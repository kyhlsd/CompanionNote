name: Tuist Test on PR to develop

on:
    pull_request:
    branches:
        - develop

jobs:
    tuist-test:
    runs-on: macos-latest

    steps:
        - name: Checkout code
        uses: actions/checkout@v3
            
        - name: Install Mise
        run: |
            curl -Ls https:mise.run | bash
            mise install
        
        - name: Tuist install & generate
        run: |
          mise x -- tuist install
          mise x -- tuist generate
        
        - name: Run tests
        run: |
          mise x -- tuist test
