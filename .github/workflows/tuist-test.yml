name: Tuist Test on PR to develop

on:
  pull_request:
    branches:
      - develop

jobs:
  tuist-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Cache Tuist build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .tuist/Cache
            .build
            DerivedData
          key: tuist-${{ runner.os }}-${{ hashFiles('**/Project.swift', '**/Workspace.swift', '**/Tuist/Dependencies.swift') }}
          restore-keys: |
            tuist-${{ runner.os }}-

      - name: Install Mise
        run: |
          curl -Ls https://mise.run | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Tuist install & generate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export SWIFTFLAGS="-enable-experimental-feature AccessLevelOnImport"
          mise x -- tuist install
          mise x -- tuist generate

      - name: Build project
        run: |
          export SWIFTFLAGS="-enable-experimental-feature AccessLevelOnImport"
          export OTHER_SWIFT_FLAGS="-enable-experimental-feature AccessLevelOnImport"
          mise x -- tuist build
    
      - name: Shutdown and erase all simulators
        run: |
          xcrun simctl shutdown all
          xcrun simctl erase all
            
      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export OTHER_SWIFT_FLAGS="-enable-experimental-feature AccessLevelOnImport"
          mise x -- tuist test

