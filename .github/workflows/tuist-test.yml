name: Tuist Test on PR to develop

on:
  pull_request:
    branches:
      - develop

jobs:
  tuist-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Tuist build artifacts
        uses: actions/cache@v3
        with:
          path: |
            .tuist/Cache
            .build
            DerivedData
          key: tuist-${{ runner.os }}-${{ hashFiles('**/Project.swift', '**/Workspace.swift', '**/Tuist/Dependencies.swift') }}
          restore-keys: |
            tuist-${{ runner.os }}-

      - name: Install Mise
        run: |
          curl -Ls https://mise.run | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          mise install

      - name: Tuist install & generate
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export SWIFTFLAGS="-enable-experimental-feature AccessLevelOnImport"
          mise x -- tuist install
          mise x -- tuist generate

      - name: List available simulators (for debug)
        run: xcrun simctl list devices

      - name: Prepare simulator
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          xcrun simctl delete unavailable || true
          xcrun simctl boot "iPhone 16 Pro"

      - name: Build project
        run: |
          export SWIFTFLAGS="-enable-experimental-feature AccessLevelOnImport"
          export OTHER_SWIFT_FLAGS="-enable-experimental-feature AccessLevelOnImport"
          mise x -- tuist build

      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          export OTHER_SWIFT_FLAGS="-enable-experimental-feature AccessLevelOnImport"
          UDID=$(xcrun simctl list devices | grep "iPhone 16 Pro (" | grep -v "unavailable" | awk -F '[()]' '{print $2}' | head -n 1)
          xcrun simctl boot $UDID || true
          sleep 10
          xcrun simctl list devices | grep Booted
          mise x -- tuist test -d "id=$UDID"
#          mise x -- tuist test -d 'platform=iOS Simulator,name=iPhone 16 Pro,OS=18.2'

      - name: Upload test results (.xcresult)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
